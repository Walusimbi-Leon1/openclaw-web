name: Host OpenClaw Web

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'How long to keep OpenClaw running (seconds, default 7200 = 2 hours)'
        required: false
        default: '7200'
      tunnel_type:
        description: 'Tunnel: trycloudflare (no account) or cloudflared_named (needs CF_ACCOUNT_ID + TOKEN)'
        required: false
        default: 'trycloudflare'

concurrency:
  group: openclaw-web-session
  cancel-in-progress: false

jobs:
  openclaw-web:
    name: OpenClaw behind trycloudflare tunnel
    runs-on: ubuntu-22.04
    timeout-minutes: 150  # hard cap (~2h30m)

    steps:
      # ── 1. Install system dependencies ──
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git build-essential python3 unzip jq

      # ── 2. Install nvm + Node 26 ──
      - name: Setup Node 26
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install 26
          nvm use 26
          nvm alias default 26
          node --version
          npx --version

      # ── 3. Install openclaw (GLOBAL — required so the binary is on PATH) ──
      - name: Install openclaw
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 26 --silent
          npm install -g npm@latest
          npm install -g openclaw@latest
          NODE_BIN="$(dirname "$(command -v node)")"
          echo "$NODE_BIN" >> "$GITHUB_PATH"
          echo "node: $(command -v node) -> $(node --version)"
          echo "openclaw: $(command -v openclaw)"
          openclaw --version

      # ── 4. Write identity/workspace files (from private Codespace-3 repo) ──
      - name: Fetch identity files from Codespace-3
        env:
          GH_PAT: '${{ secrets.GH_PAT_Codespace3 }}'
          GH_TOKEN_FALLBACK: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          mkdir -p "$HOME/openclaw-workspace"
          BASE="https://raw.githubusercontent.com/Walusimbi-Leon1/Codespace-3/main"
          AUTH_ARGS=()
          if [ -n "$GH_PAT" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer $GH_PAT")
          elif [ -n "$GH_TOKEN_FALLBACK" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer $GH_TOKEN_FALLBACK")
          fi
          for f in SOUL.md IDENTITY.md USER.md MEMORY.md AGENTS.md HEARTBEAT.md TOOLS.md; do
            if ! curl -sfL "${AUTH_ARGS[@]}" "$BASE/$f" -o "$HOME/openclaw-workspace/$f"; then
              if [ "$f" = "MEMORY.md" ] || [ "$f" = "AGENTS.md" ] || [ "$f" = "HEARTBEAT.md" ] || [ "$f" = "TOOLS.md" ]; then
                echo "::warning::failed to fetch optional $f (continuing without it)"
              else
                echo "::error::failed to fetch required $f — check GH_PAT_Codespace3 secret"
                exit 1
              fi
            fi
          done
          echo "Identity files written:"
          ls -la "$HOME/openclaw-workspace/"

      # ── 5. Install Firebase Admin SDK for session sync ──
      - name: Install Firebase Admin SDK
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 26 --silent
          npm install firebase-admin

      # ── 6. Pull sessions from Firebase RTDB (if configured) ──
      - name: Pull OpenClaw sessions from Firebase
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT && secrets.FIREBASE_DATABASE_URL }}
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          FIREBASE_DATABASE_URL: '${{ secrets.FIREBASE_DATABASE_URL }}'
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 26 --silent
          node scripts/sync-sessions.js pull || true

      # ── 7. Generate openclaw.json config ──
      - name: Configure OpenClaw
        id: config
        env:
          OPENCODE_API_KEY: '${{ secrets.OPENCODE_API_KEY }}'
          OPENCLAW_TOKEN_IN: '${{ secrets.OPENCLAW_GATEWAY_TOKEN }}'
          SESSION_KEY: '${{ secrets.SESSION_KEY }}'
          # Use a fixed token if provided in secret, otherwise generate one
        run: |
          WORKSPACE_DIR="$HOME/openclaw-workspace"
          mkdir -p "$HOME/.openclaw"
          # Use the secret token if provided, otherwise generate a random one
          OPENCLAW_TOKEN="${OPENCLAW_TOKEN_IN}"
          if [ -z "$OPENCLAW_TOKEN" ]; then
            OPENCLAW_TOKEN="la5-colab-8133ea97d77b5c47"  # Fixed token as requested
          fi
          echo "OPENCLAW_TOKEN=$OPENCLAW_TOKEN" >> "$GITHUB_ENV"
          echo "token=$OPENCLAW_TOKEN" >> "$GITHUB_OUTPUT"
          # Optional session key. Defaults to "main".
          SKEY="${SESSION_KEY:-main}"
          echo "SESSION_KEY_USED=$SKEY" >> "$GITHUB_OUTPUT"
          cat > "$HOME/.openclaw/openclaw.json" << JSONEOF
          {
            "gateway": {
              "mode": "local",
              "port": 18789,
              "bind": "loopback",
              "auth": {
                "mode": "token",
                "token": "$OPENCLAW_TOKEN",
                "allowTailscale": false
              },
              "controlUi": {
                "enabled": true,
                "basePath": "/",
                "allowedOrigins": [],
                "dangerouslyAllowHostHeaderOriginFallback": true,
                "allowInsecureAuth": true,
                "dangerouslyDisableDeviceAuth": true
              },
              "tailscale": { "mode": "off", "resetOnExit": false }
            },
            "agents": {
              "defaults": {
                "workspace": "$WORKSPACE_DIR",
                "model": { "primary": "oc-hy3-free/hy3-free" },
                "timeoutSeconds": 86400
              },
              "main": { "workspace": "$WORKSPACE_DIR" }
            },
            "models": {
              "mode": "merge",
              "providers": {
                "oc-hy3-free": {
                  "baseUrl": "https://opencode.ai/zen/v1",
                  "api": "openai-completions",
                  "apiKey": "${OPENCODE_API_KEY}",
                  "timeoutSeconds": 86400,
                  "models": [{
                    "id": "hy3-free", "name": "oc/hy3-free (Primary)",
                    "contextWindow": 128000, "maxTokens": 4096,
                    "input": ["text"],
                    "cost": {"input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0},
                    "reasoning": false
                  }]
                },
                "oc-nemotron-3.5-lightning-free": {
                  "baseUrl": "https://opencode.ai/zen/v1",
                  "api": "openai-completions",
                  "apiKey": "${OPENCODE_API_KEY}",
                  "timeoutSeconds": 86400,
                  "models": [{
                    "id": "nemotron-3.5-lightning-free", "name": "oc/nemotron-3.5-lightning-free (Fast)",
                    "contextWindow": 128000, "maxTokens": 4096,
                    "input": ["text"],
                    "cost": {"input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0},
                    "reasoning": false
                  }]
                },
                "oc-laguna-s-2.1-free": {
                  "baseUrl": "https://opencode.ai/zen/v1",
                  "api": "openai-completions",
                  "apiKey": "${OPENCODE_API_KEY}",
                  "timeoutSeconds": 86400,
                  "models": [{
                    "id": "laguna-s-2.1-free", "name": "oc/laguna-s-2.1-free (Fallback)",
                    "contextWindow": 128000, "maxTokens": 4096,
                    "input": ["text"],
                    "cost": {"input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0},
                    "reasoning": false
                  }]
                },
                "custom-opencode-ai": {
                  "baseUrl": "https://opencode.ai/zen/v1",
                  "api": "openai-completions",
                  "apiKey": "${OPENCODE_API_KEY}",
                  "timeoutSeconds": 86400,
                  "models": [{
                    "id": "big-pickle", "name": "big-pickle (Last Resort)",
                    "contextWindow": 200000, "maxTokens": 16384,
                    "input": ["text"],
                    "cost": {"input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0},
                    "reasoning": false
                  }]
                }
              }
            },
            "session": { "dmScope": "per-channel-peer" },
            "tools": { "profile": "coding" }
          }
          JSONEOF
          python3 -c "import json; json.load(open('$HOME/.openclaw/openclaw.json')); print('Config OK')"

      # ── 8. Install cloudflared ──
      - name: Install cloudflared
        run: |
          sudo curl -sL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      # ── 9. Start OpenClaw gateway + cloudflared tunnel TOGETHER and stay alive ──
      # Single shell for the rest of the job lifetime so the gateway never gets
      # reaped between steps (the cause of the 502 in earlier tries). Gateway and
      # cloudflared are background siblings; we then wait for the requested duration.
      - name: Run OpenClaw behind trycloudflare tunnel
        id: run
        env:
          OPENCLAW_TOKEN: '${{ steps.config.outputs.token }}'
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 26 --silent
          cd "$HOME/.openclaw"
          echo "Starting OpenClaw gateway on 127.0.0.1:18789..."
          setsid bash -c 'openclaw gateway run --port 18789 --bind loopback > /tmp/openclaw-gateway.log 2>&1' &
          GW_PID=$!
          echo "Starting cloudflared trycloudflare tunnel..."
          setsid bash -c 'cloudflared tunnel --url http://127.0.0.1:18789 --no-autoupdate > /tmp/cloudflared.log 2>&1' &
          CF_PID=$!
          # --- wait for gateway readiness ---
          HEALTHY=0
          for i in $(seq 1 60); do
            if grep -qiE "listening|ready|http server|gateway (is )?running|started" /tmp/openclaw-gateway.log 2>/dev/null; then
              HEALTHY=1; break
            fi
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 \
              -H "Authorization: Bearer $OPENCLAW_TOKEN" "http://127.0.0.1:18789/health" 2>/dev/null || echo "000")
            if [ "$CODE" != "000" ]; then
              HEALTHY=1; break
            fi
            sleep 1
          done
          if [ "$HEALTHY" != "1" ]; then
            echo "❌ Gateway did not become healthy"
            echo "=== gateway.log (tail) ==="
            tail -40 /tmp/openclaw-gateway.log 2>/dev/null
            exit 1
          fi
          echo "✅ Gateway healthy"
          # --- wait for the trycloudflare URL ---
          TUNNEL_URL=""
          for i in $(seq 1 45); do
            TUNNEL_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Failed to acquire trycloudflare tunnel URL"
            echo "=== cloudflared.log (tail) ==="
            tail -30 /tmp/cloudflared.log 2>/dev/null
            exit 1
          fi
          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_OUTPUT"
          echo "✅ tunnel acquired: $TUNNEL_URL"
          # --- verify tunnel reaches gateway (any non-000 = origin reachable) ---
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -H "Authorization: Bearer $OPENCLAW_TOKEN" "$TUNNEL_URL/" || echo "000")
          echo "CONTROL_UI_HTTP_STATUS=$CODE"
          if [ "$CODE" = "000" ]; then
            echo "❌ Tunnel could not reach the gateway (connection failed)"
            exit 1
          fi
          # 200 = UI served. 401/403 also means origin reachable and responding.
          if [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "✅ Tunnel reaches the OpenClaw gateway (HTTP $CODE)"
          else
            echo "⚠️ Tunnel reached gateway but HTTP $CODE (auth may be gating /). UI may need the token."
          fi
          # --- emit details ---
          DURATION="${{ inputs.duration || '7200' }}"
          echo "================================"
          echo " OpenClaw Web UI is ready!"
          echo "================================"
          echo "FINAL_URL=$TUNNEL_URL"
          echo "GATEWAY_TOKEN=***"
          echo "SESSION_KEY=*** steps.config.outputs.SESSION_KEY_USED }}"
          echo "Open the URL in your browser — enter the token at the auth prompt."
          {
            echo "# OpenClaw Web UI is ready"
            echo ""
            echo "**URL:** $TUNNEL_URL"
            echo ""
            echo "**Gateway token:** \`$(if [ -z "$OPENCLAW_TOKEN" ]; then echo "(generated — see run logs)"; else echo "$OPENCLAW_TOKEN"; fi)\`"
            echo ""
            echo "Open the URL in your browser and enter the token when prompted."
          } >> "$GITHUB_STEP_SUMMARY"
          # --- stay alive for the requested duration ---
          echo "Keeping OpenClaw alive for $DURATION seconds..."
          ALIVE=0
          for i in $(seq 1 "$DURATION"); do
            if ! kill -0 $GW_PID 2>/dev/null && ! kill -0 $CF_PID 2>/dev/null; then
              echo "❌ Both gateway and cloudflared exited early"
              break
            fi
            sleep 1
            ALIVE=$i
          done
          echo "Ran for $ALIVE seconds (requested $DURATION)."

      # ── 10. Push sessions to Firebase RTDB (if configured) ──
      - name: Push OpenClaw sessions to Firebase
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT && secrets.FIREBASE_DATABASE_URL }}
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          FIREBASE_DATABASE_URL: '${{ secrets.FIREBASE_DATABASE_URL }}'
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 26 --silent
          node scripts/sync-sessions.js push || true
          echo "✅ Session sync completed"

      # ── 11. Final logs ──
      - name: Final logs
        if: always()
        run: |
          echo "=== OpenClaw Gateway Log (tail) ==="
          tail -30 /tmp/openclaw-gateway.log 2>/dev/null || echo "(no gateway log)"
          echo ""
          echo "=== Cloudflared Log (tail) ==="
          tail -15 /tmp/cloudflared.log 2>/dev/null || echo "(no cloudflared log)"
          echo ""
          echo "=== trycloudflare URL ==="
          grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -1 || echo "(none)"
