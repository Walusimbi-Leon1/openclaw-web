                    "ollama/gemma4:31b": { "alias": "Gemma 4 31B (Ollama 1)" },
                    "ollama/gpt-oss:120b": { "alias": "GPT OSS 120B (Ollama 1)" },
                    "ollama/gpt-oss:20b": { "alias": "GPT OSS 20B (Ollama 1)" },
                    "ollama/nemotron-3-nano:30b": { "alias": "Nemotron 3 Nano 30B (Ollama 1)" },
                    "ollama/nemotron-3-super": { "alias": "Nemotron 3 Super (Ollama 1)" },
