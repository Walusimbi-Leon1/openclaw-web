name: Host OpenClaw Web

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'How long to keep OpenClaw running (seconds, default 7200 = 2 hours)'
        required: false
        default: '7200'
      tunnel_type:
        description: 'Tunnel: trycloudflare (no account) or cloudflared_named (needs CF_ACCOUNT_ID + TOKEN)'
        required: false
        default: 'trycloudflare'

concurrency:
  group: openclaw-web-session
  cancel-in-progress: false

jobs:
  openclaw-web:
    name: OpenClaw behind trycloudflare tunnel
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git build-essential python3 unzip jq

      - name: Setup Node 26
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install 26
          nvm use 26
          nvm alias default 26

      - name: Install openclaw
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 26 --silent
          npm install -g openclaw@latest
          # The 'openclaw plugins enable' command requires a specific plugin ID.
          # To accept all default capabilities for the current version, we use:
          openclaw plugins accept-all
          NODE_BIN="$(dirname "$(command -v node)")"
          echo "$NODE_BIN" >> "$GITHUB_PATH"

      - name: Fetch identity files from Codespace-3
        env:
          GH_PAT: '${{ secrets.GH_PAT_Codespace3 }}'
        run: |
          mkdir -p "$HOME/openclaw-workspace"
          BASE="https://raw.githubusercontent.com/Walusimbi-Leon1/Codespace-3/main"
          for f in SOUL.md IDENTITY.md USER.md MEMORY.md AGENTS.md HEARTBEAT.md TOOLS.md; do
            curl -sfL -H "Authorization: Bearer $GH_PAT" "$BASE/$f" -o "$HOME/openclaw-workspace/$f" || echo "Warning: failed to fetch $f"
          done

      - name: Install Firebase Admin SDK
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 26 --silent
          npm install firebase-admin

      - name: Pull sessions
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          FIREBASE_DATABASE_URL: '${{ secrets.FIREBASE_DATABASE_URL }}'
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 26 --silent
          if [ -f scripts/sync-sessions.js ]; then
            node scripts/sync-sessions.js pull || true
          fi

      - name: Configure OpenClaw
        id: config
        env:
          OLLAMA_KEY_1: '${{ secrets.OLLAMA_KEY_1 }}'
          OLLAMA_KEY_2: '${{ secrets.OLLAMA_KEY_2 }}'
          OLLAMA_KEY_3: '${{ secrets.OLLAMA_KEY_3 }}'
          OLLAMA_KEY_4: '${{ secrets.OLLAMA_KEY_4 }}'
          OLLAMA_KEY_5: '${{ secrets.OLLAMA_KEY_5 }}'
          OPENCODE_API_KEY: '${{ secrets.OPENCODE_API_KEY }}'
          NVIDIA_API_KEY: '${{ secrets.NVIDIA_API_KEY }}'
          GROQ_API_KEY: '${{ secrets.GROQ_API_KEY }}'
          GOOGLE_API_KEY: '${{ secrets.GOOGLE_API_KEY }}'
          OPENROUTER_API_KEY: '${{ secrets.OPENROUTER_API_KEY }}'
          KILO_API_KEY: '${{ secrets.KILO_API_KEY }}'
        run: |
          WORKSPACE_DIR="$HOME/openclaw-workspace"
          mkdir -p "$HOME/.openclaw"
          
          FINAL_TOKEN="la5-co…5c47"
          echo "token=$FINAL_TOKEN" >> "$GITHUB_OUTPUT"
          
          # Build JSON using jq to avoid shell escaping nightmares
          jq -n \
            --arg ws "$WORKSPACE_DIR" \
            --arg ft "$FINAL_TOKEN" \
            --arg ok1 "$OLLAMA_KEY_1" --arg ok2 "$OLLAMA_KEY_2" --arg ok3 "$OLLAMA_KEY_3" --arg ok4 "$OLLAMA_KEY_4" --arg ok5 "$OLLAMA_KEY_5" \
            --arg ocp "$OPENCODE_API_KEY" --arg nvi "$NVIDIA_API_KEY" --arg grq "$GROQ_API_KEY" --arg ggl "$GOOGLE_API_KEY" --arg opr "$OPENROUTER_API_KEY" --arg klo "$KILO_API_KEY" \
            '{
              agents: {
                defaults: {
                  workspace: $ws,
                  model: { primary: "opencode-ai/big-pickle" },
